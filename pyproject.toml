[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anant", email = "sanant640@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-community",
    "langchain-text-splitters>=1.1.2",
    "numpy",
    "pypdf",
    "pymupdf",
    "chromadb",
    "opentelemetry-exporter-otlp-proto-common",
    "scikit-learn",
    "sentence-transformers",
    "torch",
    "transformers",
]

[project.scripts]
rag-project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
